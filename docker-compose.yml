version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./Dataset:/app/Dataset
    environment:
      - VEHICLE_MODEL=/app/models/vehicle_detector.pt
      - PLATE_MODEL=/app/models/plate_detector.pt
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
